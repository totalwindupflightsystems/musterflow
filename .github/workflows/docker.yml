name: docker

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout musterflow
        uses: actions/checkout@v4

      # Deliberately no "Checkout muster engine" / "Resolve muster engine replace"
      # step here. The engine is a published module pinned in go.mod, so this job
      # builds exactly the module graph a user gets from `docker compose up -d
      # --build`. A ./muster checkout or a generated go.work would land inside the
      # build context that the Dockerfile's `COPY . .` pulls in, hiding a
      # regression that breaks the documented compose path.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download

      - name: Build static binary
        run: |
          CGO_ENABLED=1 go build -ldflags="-s -w" -o musterflow ./cmd/musterflow/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # No extra build context: the Dockerfile builds against the published
          # github.com/wojons/muster module pinned in go.mod (same module graph a
          # user gets from `docker compose up -d --build`). Passing a `muster`
          # context here would hide a regression that breaks the documented path.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
